services:
  # -----------------------------------------------------------
  # Authoritative Real-Time Go Game Server (WebSockets + REST)
  # -----------------------------------------------------------
  - type: web
    name: heysakhi-catchhearts-backend
    runtime: go
    plan: free
    rootDir: server
    buildCommand: go build -o catchhearts-server .
    startCommand: ./catchhearts-server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
